# FR-18C: non-public dev/CI OTLP ingestion, no raw log ingestion.
# Source app scrubs unsafe data before the SDK queue; Collector adds defense
# in depth. This list is not a general PII sanitizer for arbitrary DTOs.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  attributes/drop_secrets:
    actions:
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: url.path
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
      - key: enduser.id
        action: delete
      - key: user.id
        action: delete
      - key: tenant.id
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 3s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 256
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 5m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop_secrets, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: warn
