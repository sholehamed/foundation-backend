name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Foundation.slnx
      - name: Build
        run: dotnet build Foundation.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Foundation.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
