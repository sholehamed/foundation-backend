name: BFF foundation CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bff-and-solution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: FR-13A staging preflight (offline; no deployment/network)
        run: |
          python3 -m unittest discover -s scripts/staging -p 'test_*.py' -v
          python3 scripts/staging/preflight.py --config scripts/staging/staging.example.json
      - name: FR-14A route authorization contract audit (offline; no SQL writes)
        run: |
          python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
          python3 scripts/security/fr14a_audit.py --out /tmp/fr14a-identity-surface.json
          python3 scripts/security/fr17a_resource_inventory.py --out /tmp/fr17a-module-resource-inventory.json
      - name: Archive reviewed FR-14A endpoint inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr14a-identity-security-inventory
          path: /tmp/fr14a-identity-surface.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive FR-17A module/resource endpoint ownership inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr17a-module-resource-source-inventory
          path: /tmp/fr17a-module-resource-inventory.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Restore solution
        run: dotnet restore foundation-backend.slnx
      - name: Build solution
        run: dotnet build foundation-backend.slnx --no-restore -c Release
      - name: BFF session store tests
        run: dotnet test tests/Foundation.Bff.Tests/Foundation.Bff.Tests.csproj --no-build -c Release --logger "trx;LogFileName=bff-results.trx"
      - name: Existing Identity unit tests
        run: dotnet test tests/Shinera.Identity.Tests/Shinera.Identity.Tests.csproj --no-build -c Release

  bff-atomic-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'CiOnly_BffSql2026!_NotProduction'
        ports:
          - 1433:1433
    env:
      SHINERA_SQLSERVER_TEST_CONNECTION: 'Server=127.0.0.1,1433;Database=master;User Id=sa;Password=CiOnly_BffSql2026!_NotProduction;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore BFF SQL integration tests
        run: dotnet restore tests/Foundation.Bff.SqlServerTests/Foundation.Bff.SqlServerTests.csproj
      - name: Run disposable SQL Server BFF atomicity tests
        run: dotnet test tests/Foundation.Bff.SqlServerTests/Foundation.Bff.SqlServerTests.csproj --no-restore -c Release --logger "trx;LogFileName=bff-sql-results.trx"
      - name: Restore Identity Feature Registry SQL tests
        run: dotnet restore tests/Shinera.Identity.SqlServerTests/Shinera.Identity.SqlServerTests.csproj
      - name: Run disposable SQL Server Feature Registry and Tenant grant tests
        run: dotnet test tests/Shinera.Identity.SqlServerTests/Shinera.Identity.SqlServerTests.csproj --no-restore -c Release --filter "FullyQualifiedName~FeatureRegistrySqlServerTests|FullyQualifiedName~TenantRoleGrantSqlServerTests|FullyQualifiedName~Initial_tenant_signup_owner_can_receive_only_reviewed_catalog_grants|FullyQualifiedName~PlanCatalogSqlServerTests|FullyQualifiedName~AtomicUsageSqlServerTests" --logger "trx;LogFileName=feature-registry-sql-results.trx"
